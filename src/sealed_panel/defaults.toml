# Default configuration for sealed-panel.
#
# Every key is documented in docs/configuration.md. A spec may override the keys of [run];
# a file passed to `init --config` may override any key, within the bounds listed there.
# The effective configuration is frozen into the run directory at `init`.

[run]
# Per-run defaults. A spec may set each of these keys at its top level.
judges_per_persona = 3
max_rounds = 6
control_max = 2.0
good_min = 4.0
noise_floor_min = 0.5
# Reading stances, rotated across the judges of one persona with a random offset per round.
framings = [
    "First read as the persona would on arrival: a quick pass, then a careful one. Score what the careful read can defend.",
    "Read skeptically, as this persona at their most demanding: hunt for claims the facts do not support and for anything generic that could have been written about anyone.",
    "Read as the persona at the moment of deciding what to do next because of this item: would it move you, and what exactly would stop you?",
]

[limits]
# Lowest judges_per_persona a spec may ask for.
min_judges_per_persona = 2
# Lowest max_rounds a spec may ask for.
min_max_rounds = 1
# Valid judges needed per persona, and verified scores needed per dimension, to aggregate.
min_valid_judges = 2
# Rejected or void attempts allowed per judge slot and round before the slot is refused.
max_replacements = 2

[severity]
# Severity of the worst flaw on a dimension, and the highest score it allows.
caps = { blocking = 3, material = 4, cosmetic = 5, none = 5 }
# Severities that become findings for the author.
findings = ["blocking", "material"]

[quotes]
# A quote shorter than this, once normalised, locates nothing.
min_chars = 12
# Each fragment of a quote joined by an ellipsis must be at least this long.
min_fragment_chars = 6
# A judge whose share of unverified quotes is above this fraction is discarded.
max_bad_share = "1/3"

[transcript]
# A transcript is a JSONL file. The reply is the last entry whose role_key equals
# assistant_role and whose message holds at least one non-empty text block. The prompt is
# the first entry whose role_key equals user_role; it must contain the whole brief.
role_key = "type"
assistant_role = "assistant"
user_role = "user"
message_key = "message"
content_key = "content"
block_type_key = "type"
text_block_type = "text"
text_key = "text"
# Key holding the agent id. When present, it must equal --agent-id.
agent_id_key = "agentId"
# Some agent runtimes return a subagent's answer as a tool call rather than as a final text.
# Name that tool here to read its message as the reply; empty means no tool is read. A
# runtime without this tool is unaffected. A run frozen earlier keeps the value it has.
handback_tool = "SubagentHandback"
tool_block_type = "tool_use"
tool_name_key = "name"
tool_input_key = "input"
tool_message_key = "message"
# A handback whose tool result (in a user entry) is an error was refused and never delivered.
tool_id_key = "id"
tool_result_type = "tool_result"
tool_result_id_key = "tool_use_id"
tool_error_key = "is_error"

[judge]
# The judge runner. `sealed-panel judge` starts one process per brief with this argument list
# (never through a shell), writes the brief file's bytes to its stdin and reads its stdout as
# the reply. Empty means host mode: your agent host runs the judges and `record` stores their
# replies. The argument list is stored with every reply: keep credentials out of it.
command = []
# Seconds a judge process may run; past it, the process is stopped and the brief gets no reply.
timeout_s = 300
# Bytes a judge may write to stdout; past it, the process is stopped and the brief gets no reply.
max_reply_bytes = 1048576
# Bytes it may write to stderr, kept in the log beside the brief; past it, the same.
max_stderr_bytes = 1048576
# Names of environment variables passed to the judge process, besides PATH, HOME and LANG.
# Nothing else from the environment reaches it.
env_allow = []
# The model the judges run on, as free text, frozen and printed next to the grade. Pin a dated
# model id, never an alias: an alias can point to another model the day after. Empty: not declared.
model_id = ""

[mcp]
# The MCP server's root: every path a tool takes must resolve under it (symlinks followed).
# Empty means the directory the server starts in; `sealed-panel mcp --root` overrides it.
# Absolute or starting with ~. Not a grading setting: it is not listed with the overrides.
root = ""

[library]
# The user rubric library: user templates, inbox/ and history/. Empty means the user-level
# default (~/.local/share/sealed-panel/rubrics, or the platform equivalent); the environment
# variable SEALED_PANEL_RUBRICS overrides it. `~` is expanded. init freezes the resolved path.
path = ""
# After a sealed panel aggregates, write learned candidates to the inbox.
learn = true
# control_too_close fires only when the sealed candidate's mean raw score on a dimension is at
# least this (a strong text), and the control's mean raw score is within control_gap of it.
# Below it, a low control and a low candidate say nothing about the dimension.
control_min_candidate = 4.0
control_gap = 1.0

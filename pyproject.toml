[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sealed-panel"
version = "0.3.0"
description = "Grade a text with blind panels of LLM judges, then let a sealed panel give the final grade."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Thibaut Drapp" }]
keywords = ["evaluation", "llm-as-judge", "rubric", "agents", "writing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=4.1.6,<4.2"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.7",
    "fastmcp>=4.1.6,<4.2",
    "pytest-asyncio>=1.0",
]

[project.scripts]
sealed-panel = "sealed_panel.cli:main"

[project.urls]
Homepage = "https://github.com/tdrapp/sealed-panel"
Issues = "https://github.com/tdrapp/sealed-panel/issues"
Changelog = "https://github.com/tdrapp/sealed-panel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sealed_panel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "skill/",
    "docs/",
    "examples/",
    "tools/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Mutation anchors are verbatim lines of code.
"tools/mutation_check.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tools", "examples"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=sealed_panel --cov-report=term-missing --cov-fail-under=97"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["sealed_panel"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

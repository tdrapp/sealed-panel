name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  # The core needs no third-party package: without the mcp extra, the MCP tests skip and
  # every other test passes. Coverage is checked in the job above, where the MCP server runs.
  test-core:
    name: test (${{ matrix.python-version }}, core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync python -c "import importlib.util as u, sys; sys.exit(u.find_spec('fastmcp') is not None)"
      - run: uv run --no-sync pytest -o addopts="-q -rs"

  # The package as users get it: the sdist and the wheel build, the wheel installs in a fresh
  # environment with the versions of the lock, the command runs and the MCP server starts.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv build --sdist --wheel --out-dir dist
      - name: Install the wheel in a fresh environment
        run: |
          uv export --locked --extra mcp --no-default-groups --no-emit-project --no-hashes \
            --format requirements-txt --output-file "$RUNNER_TEMP/constraints.txt"
          uv venv "$RUNNER_TEMP/wheel-env"
          wheel="$(ls dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" \
            --constraints "$RUNNER_TEMP/constraints.txt" "sealed-panel[mcp] @ file://$PWD/$wheel"
      - name: The command reports the package version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "$("$RUNNER_TEMP/wheel-env/bin/sealed-panel" --version)" = "sealed-panel $version"
      - name: The MCP server answers initialize
        run: python3 tools/smoke_mcp.py "$RUNNER_TEMP/wheel-env/bin/sealed-panel"

  # Known vulnerabilities in every locked package: runtime, the mcp extra and the tools.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: |
          uv export --locked --all-extras --all-groups --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/audit.txt"
      - run: |
          uv run --locked --only-group audit pip-audit --strict --require-hashes --disable-pip \
            --requirement "$RUNNER_TEMP/audit.txt"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync actionlint

  # Secrets anywhere in the history. The binary is a pinned release, checked by its sha256;
  # .gitleaks.toml allowlists the sha256 digests of the test fixtures and the lock.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  # The layers in [tool.importlinter]: the command line and the MCP server above the core,
  # store and errors at the bottom.
  imports:
    name: imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync lint-imports

  # Complexity may not grow: xenon caps the ranks at today's (worst block F, worst module D,
  # average B), and tools/complexity_check.py holds every block at its frozen baseline.
  complexity:
    name: complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the base branch, for the baseline it is compared with
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync xenon --max-absolute F --max-modules D --max-average B src tools examples
      - run: uv run --no-sync python tools/complexity_check.py
      # The baseline may not hold more entries, or a higher sum, than on the base branch.
      - if: github.event_name == 'pull_request'
        run: uv run --no-sync python tools/complexity_check.py --against "origin/$GITHUB_BASE_REF"

  # Docstring coverage of the public API ([tool.interrogate]); ruff's D1 and D417 run in lint.
  docstrings:
    name: docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync interrogate src

  # Every mutation on every pull request, in four shards of two workers each; the job named
  # mutation, the required check, passes only when every shard ran and the merged outcomes
  # keep the rule (CONTRIBUTING.md, "The mutation check").
  mutation-shard:
    name: mutation (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      # The dev group, so the MCP tests (and the lines they cover) are in the coverage map.
      - run: uv sync --locked
      # Every anchor found once, in a second, before the shard's hour of tests.
      - run: uv run --no-sync python tools/mutation_check.py --anchors-only
      - run: >-
          uv run --no-sync python tools/mutation_check.py --jobs 2 --shard ${{ matrix.shard }}/4
          --json mutation-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation-${{ matrix.shard }}.json
          if-no-files-found: ignore

  mutation:
    name: mutation
    needs: mutation-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        if: needs.mutation-shard.result != 'success'
        run: |
          echo "::error::a mutation shard did not succeed: ${{ needs.mutation-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked --no-default-groups --group test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutation-*
          merge-multiple: true
      - run: uv run --no-sync python tools/mutation_check.py --merge mutation-*.json
      - run: >-
          uv run --no-sync pytest -o addopts="-q"
          tests/test_docs.py::test_the_readme_mutation_figures_match_the_tool

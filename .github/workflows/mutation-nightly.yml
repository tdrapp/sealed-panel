name: mutation nightly

# The pull request check maps each mutation to the tests that execute it. Each night the whole
# suite runs on every mutation instead, in one job, so a fault in that map cannot hide for long.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-nightly:
    name: mutation (whole suite)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: >-
          uv run --no-sync python tools/mutation_check.py --jobs 2 --full-suite
          --json mutation-nightly.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-nightly
          path: mutation-nightly.json
          if-no-files-found: ignore
      - name: report the failure
        if: failure()
        run: |
          echo "::error::the nightly mutation check failed on ${{ github.sha }}"
          echo "The nightly mutation check failed on ${{ github.sha }}: see the log." >> "$GITHUB_STEP_SUMMARY"

name: Release

# A tag v* builds the sdist and the wheel and publishes them through trusted publishing: the
# package index trusts this workflow in the `pypi` environment, so no token exists anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The same uv and the same command as the CI build job, whose output that job installs
      # and smoke-tests: the published files are built the way the tested ones were.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: The tag names the package version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv lock --check
      - run: uv build --sdist --wheel --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

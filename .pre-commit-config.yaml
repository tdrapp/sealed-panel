default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^(src|tools|examples)/
        args: [--config-file=pyproject.toml]
        additional_dependencies: ["fastmcp>=4.1.6,<4.2", "coverage>=7"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Secrets in what is staged; .gitleaks.toml allowlists the sha256 digests of the fixtures.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        # The same test dependencies as the dev extra, so the coverage floor counts the MCP tests.
        additional_dependencies:
          ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=1.0", "fastmcp>=4.1.6,<4.2"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
